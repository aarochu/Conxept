# Standalone deployment: docker compose --env-file deploy/.env -f deploy/compose.yml up -d
services:
  engine:
    image: ghcr.io/aarochu/conxept-engine:${IMAGE_TAG:?Set IMAGE_TAG to a published commit SHA}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${ENGINE_DATABASE_URL:?Set the read-only engine connection URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-anthropic:claude-sonnet-5-5}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 50051), 1)"]
      interval: 5s
      timeout: 3s
      retries: 60
  gateway:
    image: ghcr.io/aarochu/conxept-gateway:${IMAGE_TAG:?Set IMAGE_TAG to a published commit SHA}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${GATEWAY_DATABASE_URL:?Set the gateway connection URL}
      ENGINE_ADDR: http://engine:50051
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      engine:
        condition: service_healthy
